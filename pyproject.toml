[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arch2terraform"
version = "0.1.0"
description = "Converts architecture diagrams into validated Terraform modules"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Pillow>=10.0",
    "imagehash>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
phase3 = [
    "Pillow>=10.0",
    "imagehash>=4.3",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pytesseract>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
