server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default (1MB) is well under what a real architecture diagram
    # upload needs — image exports and multi-page drawio/excalidraw files
    # routinely exceed that, which nginx rejects with a plain-text 413
    # before the request ever reaches the backend. The frontend's error
    # handling then tries to JSON-parse that plain-text body, which throws
    # and surfaces as a misleading "Cannot connect to backend" message
    # instead of the real cause — see index.html's startUpload() catch
    # block. Matches the backend's own MAX_FILE_SIZE_MB (pipeline.py) —
    # nginx should never be a tighter ceiling than the app itself allows.
    client_max_body_size 50m;

    # Proxy API calls to FastAPI backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
