[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arch2terraform"
version = "0.1.0"
description = "Converts architecture diagrams into validated Terraform modules"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Pillow>=10.0",
    "imagehash>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
phase3 = [
    "Pillow>=10.0",
    "imagehash>=4.3",
    # Pinned below 5.0: OpenCV 5.0 changed cv2.HoughLinesP's return shape
    # from (N,1,4) to (N,4), which broke layout_detector.py/edge_detector.py
    # (both now use a shape-agnostic reshape(-1)[:4] unpack, so this pin is
    # a belt-and-suspenders safety net, not the only fix). Confirmed via a
    # clean-venv repro on 2026-08-18 -- see the reproducibility notes.
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26",
    "pytesseract>=0.3",
]
# Vision-LLM detection path (adapters/image/vision_llm_detector.py) — an
# opt-in alternative to the classical phase3 CV cascade, enabled via
# ImageAdapter(use_vision_llm=True) or the ARCH2TERRAFORM_USE_VISION_LLM env
# var. Kept as a separate extra rather than folded into phase3 since it's
# the only piece requiring network access / an API key.
vision_llm = [
    "anthropic>=0.120",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
